name: Facebook News Sync

# Pulls the latest Provincial Government of Bukidnon Facebook posts, categorizes
# them, merges them into src/content/data/news.json, and (if changed) uploads the file.
#
# The site imports news.json at build time, so a change goes live only after it is
# committed and the site rebuilds. Download the artifact and commit it to develop.
# Runs on a schedule with no manual intervention. Stays dormant and harmless
# until FB_ACCESS_TOKEN is added as a repository secret.

on:
  schedule:
    # Every 20 minutes. GitHub may delay scheduled runs under load, so realistic
    # freshness is ~15-30 min. Tighten/loosen as needed.
    - cron: '*/20 * * * *'
  workflow_dispatch: {} # allows a manual run from the Actions tab for testing

permissions:
  contents: read

concurrency:
  group: facebook-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Sync Facebook posts into src/content/data/news.json
        id: sync
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          # Optional overrides:
          # FB_API_VERSION: v21.0
          # FB_LIMIT: '25'
          # MAX_FB_ITEMS: '30'
        run: node scripts/sync-facebook.js

      - name: Upload news.json artifact
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: news-json
          path: src/content/data/news.json
          retention-days: 7
