name: PR Quality Gates

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Data, Chrome & Playwright Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check shared page chrome
        run: npm run chrome:check

      - name: Validate JSON data, PSGC integrity & local links
        run: npm run validate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright civic directory and route smoke tests
        run: npx playwright test tests/chrome.spec.js tests/civic-directories.spec.js --project=chrome
